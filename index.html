<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reroom.</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <script defer src="javascripts/scripts.js"></script>
  </head>
  <body>
    <main class="hero" aria-labelledby="hero-title">
      <header class="hero__header" aria-label="Главная навигация">
        <nav class="hero__nav">
          <a href="ourplaces.html">Наши локации</a>
          <a href="work.html">Стань частью команды</a>
          <a href="#shop">Магазин</a>
        </nav>
        <a class="hero__logo" href="index.html" aria-label="Reroom на главную">reroom.</a>
      </header>

      <section class="hero__content">
        <h1 id="hero-title">Пространство для отдыха<br />в ритме города</h1>
        <a class="hero__button" href="#booking">Забронировать комнату</a>
      </section>

      <section class="hero__animation" aria-label="Анимированный силуэт здания Reroom">
        <div class="building building--one" aria-hidden="true">
          <span class="building__window building__window--one"></span>
          <span class="building__window building__window--two"></span>
        </div>
        <div class="building building--two" aria-hidden="true">
          <span class="building__window building__window--one"></span>
          <span class="building__window building__window--two"></span>
        </div>
        <div class="building building--three" aria-hidden="true">
          <span class="building__window building__window--one"></span>
          <span class="building__window building__window--two"></span>
        </div>
        <div class="building building--four" aria-hidden="true">
          <span class="building__window building__window--one"></span>
          <span class="building__window building__window--two"></span>
        </div>
        <div class="building building--five" aria-hidden="true">
          <span class="building__window building__window--one"></span>
          <span class="building__window building__window--two"></span>
        </div>
        <div class="building building--six" aria-hidden="true">
          <span class="building__window building__window--one"></span>
          <span class="building__window building__window--two"></span>
        </div>
      </section>
    </main>
  </body>
</html>
